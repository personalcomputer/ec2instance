[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ec2instance-hetzner"
version = "0.1"
description = "Launch new Hetzner Cloud servers easily and quickly with one command"
readme = "README.md"
authors = [
    { name = "John Miller", email = "john@johngm.com" },
]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "hcloud",
    "cryptography",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.11.5",
]

[project.urls]
Homepage = "https://github.com/personalcomputer/ec2instance"

[project.scripts]
hetznerinstance = "hetznerinstance.main:main"

[tool.hatch.build]
only-include = [
    "hetznerinstance",
]

[tool.isort]
line_length = 120
default_section = "THIRDPARTY"
order_by_type = true
profile = "black"

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
ignore = ["E501", "F403", "W503", "SIM106"]
