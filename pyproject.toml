[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ec2instance"
version = "2.0.0"
description = "Launch temporary AWS, Hetzner Cloud, and vast.ai instances with one command"
readme = "README.md"
authors = [
    { name = "John Miller", email = "john@johngm.com" },
]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "boto3",
    "cryptography",
    "hcloud",
    "iso8601",
    "rich",
    "vastai",
]

[dependency-groups]
dev = [
    "black",
    "codespell>=2.2.5",
    "coverage",
    "flake8",
    "flake8-pyproject",
    "hatchling",
    "ipdb>=0.13.13",
    "isort>=5.11.5",
    "moto>=4.2.14",
    "mypy>=1.4.1",
    "pytest",
    "ruff>=0.11.5",
]

[project.urls]
Homepage = "https://github.com/personalcomputer/ec2instance"

[project.scripts]
ec2instance = "ec2instance.cli:main"
hetznerinstance = "hetznerinstance.main:main"
vastinstance = "vastinstance.main:main"

[tool.hatch.build.targets.wheel]
packages = [
    "ec2instance",
    "hetznerinstance",
    "vastinstance",
]
exclude = [
    "**/.venv",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/__pycache__",
    "**/dist",
    "**/tests",
    "**/pyproject.toml",
    "**/uv.lock",
    "**/README.md",
    "hetznerinstance/cli.toml",
]

[tool.hatch.build.targets.sdist]
include = [
    "/ec2instance",
    "/hetznerinstance",
    "/vastinstance",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]
exclude = [
    "**/.venv",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/__pycache__",
    "**/dist",
]

[tool.isort]
line_length = 120
default_section = "THIRDPARTY" # codespell:ignore
order_by_type = true
profile = "black"

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
ignore = ["E501", "F403", "W503", "SIM106"]

[tool.codespell]
# Domain/config identifiers: "ded" means dedicated CPU; THIRDPARTY is an isort section name.
ignore-words-list = "ded,thirdparty"
